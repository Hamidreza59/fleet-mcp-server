[project]
name = "fleet-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server exposing fleet-telematics tools and a RAG knowledge-search tool to AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hamid Ouni" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "telematics", "rag", "bedrock"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
fleet-mcp-server = "fleet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
